[project]
name = "tac-toolkit"
version = "0.1.0"
description = "Expert Agentic Engineering Playbook & Toolkit: AI Developer Workflows, domain packs, and control plane."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adws", "core"]

[tool.pytest.ini_options]
testpaths = ["adws/adw_tests", "core/tests", "app/server/tests"]
addopts = ""

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["trees", "agent", "app/client"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "S404", "E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B"]
"**/adw_tests/**" = ["S", "B"]
"core/fixtures/**" = ["S"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = ["trees/", "agent/", "app/client/"]

# ---------------------------------------------------------------------------
# TAC validation gates. Read from the MAIN checkout (never a worktree), so an agent
# cannot weaken the gates that judge its own work. Each command runs in the worktree.
# ---------------------------------------------------------------------------
[tool.tac.gates]
lint = ["uv", "run", "ruff", "check", "."]
types = ["uv", "run", "mypy", "adws", "core"]
unit = ["uv", "run", "pytest", "-q", "-p", "no:cacheprovider"]
client = ["bash", "-c", "cd app/client && npm ci --silent --no-audit --no-fund && npx tsc --noEmit && npm run build --silent"]

[tool.tac]
e2e_specs = ".claude/commands/e2e"
max_test_repairs = 4
max_e2e_repairs = 2
max_review_patches = 2
