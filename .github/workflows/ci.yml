name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy adws core app/server
      - run: uv run pytest -q
        env:
          TAC_AGENT_RUNNER: mock
      - run: uv run python -m core.registry swe . --tool secret_scan --fail-on high
      - run: cd app/client && npm ci && npx tsc --noEmit && npm test && npm run build

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The floor proves required_version >= 1.6 is honest; the newer pin catches drift in current releases.
        terraform: ["1.6.6", "1.17.2"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff infra/terraform
      - working-directory: infra/terraform/modules/mcp-connector
        run: terraform init -backend=false -input=false && terraform validate && terraform test
      - working-directory: infra/terraform/live
        run: terraform init -backend=false -input=false && terraform validate && terraform test
